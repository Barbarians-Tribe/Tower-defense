<title>Kule Savunma 1.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Yerleşim: tek sütun. Üstte başlık, altında HUD, ardından tam genişlikte oyun sahnesi, en altta kural çipleri.
   Bilinçli olarak tek görünüm: karanlık fantezi. Tüm renkler açıkça tanımlı. */
:root {
  --bg: #14101a;
  --panel: #211a2b;
  --line: #4d3a55;
  --edge: #0c0910;
  --ink: #cfc4b0;
  --gold: #e0b25a;
  --blood: #a24f55;
  --steel: #8fb3c9;
  --moss: #5a7568;
  --display: 'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --font: 'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 22px;
  line-height: 1.15;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 28px;
}
.wrap { max-width: 1760px; margin: 0 auto; display: grid; gap: 14px; }
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(14px, 2.4vw, 22px); color: var(--gold); text-shadow: 0 3px 0 var(--edge); letter-spacing: .04em; }
.tag { font-size: 18px; color: var(--steel); border: 2px solid var(--line); padding: 0 8px; }
.hud { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.spacer { flex: 1 1 0; }
.badge {
  display: inline-flex; align-items: center; gap: 10px; min-width: 0;
  background: var(--panel); border: 2px solid var(--line);
  box-shadow: 0 0 0 2px var(--edge), 0 5px 0 2px var(--edge);
  padding: 4px 14px 4px 10px; font-size: 28px; font-variant-numeric: tabular-nums;
}
.ico { width: 27px; height: 27px; image-rendering: pixelated; flex: none; }
.hpbar { width: 130px; height: 14px; background: #120d18; border: 2px solid var(--line); }
.hpfill { height: 100%; width: 100%; background: var(--blood); transition: width .15s; }
.btn {
  font: inherit; font-size: 24px; color: var(--ink); background: var(--panel);
  border: 2px solid var(--line); box-shadow: 0 0 0 2px var(--edge), 0 5px 0 2px var(--edge);
  padding: 3px 14px; cursor: pointer;
}
.btn:hover { color: var(--gold); border-color: var(--gold); }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 2px var(--edge); }
.btn:focus-visible { outline: 3px solid var(--steel); outline-offset: 3px; }
.btn[aria-pressed="false"] { opacity: .6; }
.stage {
  position: relative; width: max-content; max-width: 100%; margin: 0 auto;
  border: 4px solid var(--edge); box-shadow: 0 0 0 2px var(--line), 0 8px 0 2px var(--edge);
  background: #2a3335;
}
.stage canvas { display: block; }
[hidden] { display: none !important; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(12, 9, 16, .6); }
.overlay.soft { pointer-events: none; }
.panel {
  background: var(--panel); border: 3px solid var(--line); box-shadow: 0 0 0 3px var(--edge), 0 7px 0 3px var(--edge);
  padding: 18px 28px; text-align: center; display: grid; gap: 12px; justify-items: center; max-width: 100%;
}
.panel h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(14px, 3vw, 22px); color: var(--blood); line-height: 1.5; }
.panel p { margin: 0; font-size: 24px; text-wrap: balance; }
.rules { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { font-size: 20px; color: var(--moss); border: 2px dashed var(--line); padding: 0 10px; }
@media (prefers-reduced-motion: reduce) { .hpfill { transition: none; } .btn:active { transform: none; } }
.stage canvas { touch-action: none; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.btn.ready { color: var(--gold); border-color: var(--gold); }
.btn:disabled { opacity: .45; cursor: default; color: var(--ink); border-color: var(--line); }
.btn:disabled:hover { color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 3px 10px; min-width: 46px; }
.hint, .toast {
  position: absolute; left: 50%; transform: translateX(-50%); background: var(--panel);
  border: 2px solid var(--line); box-shadow: 0 0 0 2px var(--edge); padding: 2px 12px;
  pointer-events: none; text-align: center; max-width: calc(100% - 24px); font-size: 20px;
}
.hint { bottom: 12px; color: var(--steel); }
.toast { top: 12px; color: var(--gold); font-size: 24px; }
</style>

<div class="wrap">
  <div class="top">
    <h1>KULE SAVUNMA</h1>
    <span class="tag">Taslak 1.0 · Karanlık Şövalye</span>
  </div>

  <div class="hud">
    <div class="badge" title="Para"><canvas class="ico" id="icoCoin" width="8" height="8"></canvas><span id="coins">0</span></div>
    <div class="badge" title="Kule canı"><canvas class="ico" id="icoHeart" width="9" height="8"></canvas><div class="hpbar"><div class="hpfill" id="hpfill"></div></div><span id="hptext">100</span></div>
    <div class="badge" title="Öldürülen zombi"><canvas class="ico" id="icoSkull" width="9" height="9"></canvas><span id="kills">0</span></div>
    <span class="spacer"></span>
    <button class="btn sm" id="zoomOut" type="button" aria-label="Uzaklaştır">−</button>
    <button class="btn sm" id="zoomIn" type="button" aria-label="Yakınlaştır">+</button>
    <button class="btn" id="homeBtn" type="button">Merkez</button>
    <button class="btn" id="warpBtn" type="button" aria-pressed="true">Küre</button>
    <button class="btn" id="rangeBtn" type="button" aria-pressed="true">Menzil</button>
    <button class="btn" id="speedBtn" type="button">Hız 1×</button>
    <button class="btn" id="pauseBtn" type="button">Duraklat</button>
  </div>

  <div class="stage" id="stage">
    <div id="holder"></div>
    <div class="hint" id="hint">WASD: yürü · Boşluk: zıpla · Enter: kılıç (2×Enter: dönerek, basılı tut: şok dalgası) · P: duraklat · Sürükle/tekerlek: kamera</div>
    <div class="overlay soft" id="pauseOv" hidden><div class="panel"><h2>DURAKLATILDI</h2><p>Devam etmek için Devam düğmesine veya P tuşuna bas.</p></div></div>
    <div class="overlay" id="overOv" hidden>
      <div class="panel"><h2>KULE DÜŞTÜ</h2><p id="overText"></p><button class="btn" id="restartBtn" type="button">Yeniden başla</button></div>
    </div>
  </div>

  <div class="rules" id="rules" aria-label="Oyun kuralları"></div>
</div>

<script>
'use strict';
/* =====================================================================
   1) AYARLAR  (metre ve saniye)
   Dengeyi değiştirmek için sadece bu bloğu düzenlemek yeterli.
   ===================================================================== */
const CONFIG = {
  rings:    { start: 50, count: 5, width: 50 },       // start: baştan açık alanın yarıçapı (halka sayılmaz); 5 halka sırayla ileride baltalarla açılacak
  tower:    { hp: 100, contact: 4.2 },
  soldier:  { hp: 25, damage: 2, range: 2, arc: 90, cooldown: 1, delay: 0.2, speed: 11, jump: 7, torch: 10,   // kılıçlı asker: WASD yürü, Boşluk zıpla, C vur
              spinBonus: 1, comboWindow: 0.3, wave: { range: 10, width: 5, hold: 2, damage: 2, push: 3, cooldown: 1.5 } },   // 2×C: 360° döner (menzil +1 m); C'yi 2 sn basılı tut: şok dalgası
  crossbow: { interval: 1.5, damage: 1, range: 25, arrowSpeed: 70 },
  zombie:   { hp: 2, speed: 4, spawnInterval: 2, firstSpawn: 0.4, reward: 10,
              biteDamage: 1, biteInterval: 1, spawnMin: 3, spawnMax: 9 }   // doğma mesafesi: açık alanın kenarından kaç m içeride (ormanın içinde, rastgele yönde)
};
const CF = CONFIG.crossbow, ZB = CONFIG.zombie, TW = CONFIG.tower, SOL = CONFIG.soldier;
const RING_W = CONFIG.rings.width, RING_N = CONFIG.rings.count;
const START_R = CONFIG.rings.start;
const OUTER_R = START_R + RING_W * RING_N;      // 5. halkanın sonu = oynanabilir haritanın sonu (m)
const VW = 800, VH = 520;                        // ekrana basılan piksel boyutu
const FW = 1000, FH = 650;                       // küre bükmesi için biraz daha geniş ara tuval
const HR = 3;                                    // karakter ve dünya sprite'ları 1 birimin 3x3 pikselle çizilmesi
const Z = 6, TILT = 0.64, WARP_K = 0.14;         // Z: 1 m = 6 piksel
const INK = '#0c0910';

/* ---------- küçük yardımcılar, paletler, sprite araçları (v0.2'den) ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function rngf(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return (a + (b - a) * u) + ((c + (d - c) * u) - (a + (b - a) * u)) * v;
}
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]].map(r => r.map(v => (v + 0.5) / 16));
const bay = (x, y) => BAYER[y & 3][x & 3];

/* ---------- renk paletleri (referans görsel: soluk arduvaz yeşili + mor) ---------- */
const GRASSR  = ['#1b2528', '#222f31', '#2b3b3a', '#364a44', '#445b52', '#557066'].map(rgb);
const FORESTR = ['#12181b', '#171f23', '#1e2a2d', '#273639', '#324543'].map(rgb);
const DIRTR   = ['#241c26', '#30232c', '#3e2e34', '#503c3f', '#664d48'].map(rgb);
const STONER  = ['#1f1828', '#2e2438', '#40354d', '#564a63', '#6f6479', '#8a8094'].map(rgb);
const FOGR    = ['#1c2427', '#263033', '#313e40', '#3f504f', '#52665f', '#667d73'].map(rgb);
const STONE = ['#1f1828', '#2e2438', '#40354d', '#564a63', '#6f6479', '#8a8094'];
const WOOD  = ['#1a1215', '#2a1d1f', '#3d2a27', '#563b33', '#6e4c3d'];
const TG    = ['#0e1518', '#15222a', '#1e3036', '#2a4543', '#3e6358'];
const TP    = ['#120d18', '#1d1426', '#2c1f38', '#3f2d4d', '#58416a'];
const ZP = [
  { skin: ['#3d4a3c', '#5e7058', '#8a9f78'], cloth: ['#2a1f33', '#3f3050', '#5a4670'], hair: '#1b1522' },
  { skin: ['#4a4a3a', '#6f6f52', '#9a9a74'], cloth: ['#3a2428', '#5a3438', '#7a4a50'], hair: '#2a2320' },
  { skin: ['#3a4650', '#566a78', '#7f95a3'], cloth: ['#1d1a24', '#2c2836', '#403a4e'], hair: null }
];
function pick(ramp, t, b) {
  const n = ramp.length;
  return ramp[clamp(Math.floor(t * (n - 1) + b), 0, n - 1)];
}

/* ---------- sprite çizim araçları ---------- */
function outline(c, col) {
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const id = g.getImageData(0, 0, w, h), d = id.data, a = new Uint8Array(w * h), o = rgb(col);
  for (let i = 0; i < w * h; i++) a[i] = d[i * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x;
    if (a[i]) continue;
    if ((x > 0 && a[i - 1]) || (x < w - 1 && a[i + 1]) || (y > 0 && a[i - w]) || (y < h - 1 && a[i + w])) {
      d[i * 4] = o[0]; d[i * 4 + 1] = o[1]; d[i * 4 + 2] = o[2]; d[i * 4 + 3] = 255;
    }
  }
  g.putImageData(id, 0, 0);
}
function sprite(w, h, fn, out) {
  const c = mk(w, h), g = c.getContext('2d');
  fn(g);
  outline(c, out || INK);
  return c;
}
function tint(src, col, a) {
  const c = mk(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = a; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return c;
}
function line(g, x0, y0, x1, y1, col) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  g.fillStyle = col;
  for (;;) {
    g.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function blob(g, cx, cy, rx, ry, ramp, rnd, bias) {
  const n = ramp.length;
  for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++) {
    const nx = (x + 0.5 - cx) / rx, ny = (y + 0.5 - cy) / ry, q = nx * nx + ny * ny;
    if (q > 1) continue;
    let b = -0.5 * nx - 0.6 * ny + 0.65 * Math.sqrt(1 - q) + (bias || 0) + (rnd() - 0.5) * 0.35;
    b = (b + 0.5) / 1.5;
    g.fillStyle = ramp[clamp(Math.floor(b * (n - 1) + bay(x, y)), 0, n - 1)];
    g.fillRect(x, y, 1, 1);
  }
}
function shadow(g, cx, cy, rx, ry, a) {
  g.fillStyle = 'rgba(6,5,10,' + a + ')';
  for (let y = -ry; y <= ry; y++) {
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry + 0.01))));
    g.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1);
  }
}
function pixIcon(cv, rows, pal) {
  const g = cv.getContext('2d');
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
}
const SKULL_ROWS = ['..ooooo..', '.obbbbbo.', 'obbbbbbbo', 'obkkbkkbo', 'obkkbkkbo', 'obbbobbbo', '.obbbbbo.', '..obobo..', '...ooo...'];
const SKULL_PAL = { o: '#0c0910', b: '#cfc4b0', k: '#12090f' };

/* ---------- orman boşlukları (zombilerin çıktığı patikalar) ---------- */
const GAP_N = 9, GAP_HALF = 3.4;
const gaps = (() => { const r = rngf(7), a = []; for (let i = 0; i < GAP_N; i++) a.push(i / GAP_N * Math.PI * 2 + (r() - 0.5) * 0.5); return a; })();
function gapDist(a) {
  let m = 9;
  for (const g of gaps) { const d = Math.abs(Math.atan2(Math.sin(a - g), Math.cos(a - g))); if (d < m) m = d; }
  return m;
}

/* =====================================================================
   3) SPRITE ÜRETİMİ (hepsi kodla çizilir, dışarıdan dosya yok)
   ===================================================================== */
function makeSpruce(seed, ramp) {
  const r = rngf(seed);
  return sprite(40, 64, g => {
    shadow(g, 20, 61, 11, 3, 0.35);
    for (let y = 50; y < 62; y++) { g.fillStyle = WOOD[3]; g.fillRect(18, y, 1, 1); g.fillStyle = WOOD[2]; g.fillRect(19, y, 2, 1); g.fillStyle = WOOD[1]; g.fillRect(21, y, 1, 1); }
    for (let i = 0; i < 4; i++) {
      const top = 2 + i * 12, h = 18, mw = 7 + i * 3.2;
      for (let y = 0; y < h; y++) {
        const fr = y / (h - 1);
        const hw = Math.round(fr * mw + (r() < 0.3 ? -1 : 0) + (y > h - 3 && r() < 0.5 ? 1 : 0));
        for (let x = -hw; x <= hw; x++) {
          const nx = hw ? x / hw : 0;
          const b = 0.62 - 0.5 * nx - 0.25 * fr + (r() - 0.5) * 0.35;
          g.fillStyle = ramp[clamp(Math.floor(b * 5 + bay(x + 20, y + top) - 0.5), 0, 4)];
          g.fillRect(20 + x, top + y, 1, 1);
        }
      }
    }
  }, '#0a0f12');
}
function makeOak(seed, ramp) {
  const r = rngf(seed);
  return sprite(48, 60, g => {
    shadow(g, 24, 57, 13, 3, 0.35);
    for (let y = 34; y < 58; y++) {
      const ox = Math.round(Math.sin(y * 0.28) * 1.5), w = y > 52 ? 7 : 5;
      for (let x = 0; x < w; x++) { g.fillStyle = WOOD[clamp(4 - x, 1, 4)]; g.fillRect(24 + ox - Math.floor(w / 2) + x, y, 1, 1); }
    }
    line(g, 24, 38, 14, 28, WOOD[2]); line(g, 25, 38, 35, 29, WOOD[2]);
    blob(g, 24, 19, 14, 12, ramp, r); blob(g, 12, 26, 9, 8, ramp, r); blob(g, 36, 26, 9, 8, ramp, r);
    blob(g, 16, 11, 9, 8, ramp, r, 0.05); blob(g, 31, 12, 8, 7, ramp, r);
  }, '#0a0f12');
}
function makeDead(seed) {
  const r = rngf(seed);
  return sprite(40, 60, g => {
    shadow(g, 20, 57, 9, 2, 0.35);
    for (let y = 56; y > 18; y--) { const ox = Math.round(Math.sin(y * 0.2) * 2); g.fillStyle = WOOD[2]; g.fillRect(18 + ox, y, 4, 1); g.fillStyle = WOOD[4]; g.fillRect(18 + ox, y, 1, 1); g.fillStyle = WOOD[0]; g.fillRect(21 + ox, y, 1, 1); }
    for (let i = 0; i < 5; i++) {
      const y = 22 + i * 7, dir = i % 2 ? 1 : -1, len = 8 + r() * 8;
      line(g, 20, y + 6, 20 + dir * len, y - 4 - r() * 5, WOOD[2]);
      line(g, 20 + dir * len, y - 4, 20 + dir * (len + 4), y - 9 - r() * 3, WOOD[1]);
    }
  }, '#0a0f12');
}

function makeTower() {
  const W = 80, H = 114, cx = 40, yTop = 46, yBot = 98, r = rngf(21);
  const Rr = y => 15 + (clamp(y, yTop, yBot) - yTop) / (yBot - yTop) * 3;
  const back = mk(W, H), g = back.getContext('2d');
  const P = (x, y, c) => { g.fillStyle = c; g.fillRect(x, y, 1, 1); };
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
  shadow(g, cx + 8, yBot + 8, 28, 11, 0.4);
  // gövde: kavisli tuğla sıraları
  for (let y = yTop; y <= yBot + 13; y++) for (let x = cx - 20; x <= cx + 20; x++) {
    const dx = x + 0.5 - cx, Rl = Rr(y);
    if (Math.abs(dx) > Rl) continue;
    if (y > yBot + 0.64 * Math.sqrt(Math.max(0, 324 - dx * dx))) continue;
    const nx = dx / Rl, depth = 0.64 * Math.sqrt(Math.max(0, Rl * Rl - dx * dx)), h = y - depth;
    const u = Math.asin(clamp(nx, -1, 1)) * Rl, row = Math.floor((h - yTop) / 6);
    let light = 0.5 - 0.55 * nx + 0.15 * Math.sqrt(1 - nx * nx) + (r() - 0.5) * 0.3;
    let i = clamp(Math.floor(light * 5 + bay(x, y) - 0.3), 0, 5);
    if (((h - yTop) % 6) < 1 || (((u + (row % 2) * 5 + 200) % 10) < 1)) i = Math.max(0, i - 1);
    let col = STONE[i];
    if (r() < 0.07 * (h - yTop) / 52) col = r() < 0.5 ? '#2d4a3d' : '#3a5a46';
    P(x, y, col);
  }
  // kapı
  for (let y = 93; y <= 108; y++) for (let x = cx - 5; x <= cx + 4; x++) {
    const dx = x + 0.5 - cx;
    if (y < 100 && dx * dx + (y - 100) * (y - 100) > 23.5) continue;
    let c = WOOD[1 + ((x + (y > 99 ? 0 : 1)) % 3 === 0 ? 0 : 1) + (dx < 0 ? 1 : 0)];
    if (y === 101 || y === 106) c = '#3a4048';
    P(x, y, c);
  }
  P(cx + 2, 104, '#e0b25a');
  // ok yuvaları
  for (const [sx, sy] of [[cx - 9, 62], [cx + 8, 62], [cx, 70]]) { R(sx, sy, 2, 7, '#0c0910'); P(sx + 2, sy + 1, STONE[4]); }
  // meşale braketleri
  for (const tx of [cx - 12, cx + 11]) { R(tx, 96, 2, 5, '#1a1215'); P(tx, 95, '#3a4048'); }
  // flama
  for (let y = 48; y < 74; y++) {
    const fx = cx - 17, wv = y > 66 ? (y - 66) : 0, w = 7;
    for (let x = 0; x < w; x++) {
      if (y > 70 && Math.abs(x - 3) < (y - 70)) continue;

/* ---------- 3x5 piksel yazı tipi (para uçuşan yazısı için) ---------- */
const FONT = { '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
  '5': '111100111001111', '6': '111100111101111', '7': '111001001001001', '8': '111101111101111', '9': '111101111001111', '+': '000010111010000' };
function pixText(g, txt, x, y, col, sc) {
  for (let pass = 0; pass < 2; pass++) {
    let cx = x;
    for (const ch of txt) {
      const m = FONT[ch]; if (!m) continue;
      for (let i = 0; i < 15; i++) if (m[i] === '1') {
        const px = cx + (i % 3) * sc, py = y + ((i / 3) | 0) * sc;
        if (pass === 0) { g.fillStyle = INK; g.fillRect(px - 1, py - 1, sc + 2, sc + 2); } else { g.fillStyle = col; g.fillRect(px, py, sc, sc); }
      }
      cx += 4 * sc;
    }
  }
}

const CS = 3.6, WALL0 = 1.5, WALL_D = 16;
function treeAt(ix, iy) {
  if (hash(ix * 7 + 1, iy * 13 + 5) > 0.88) return null;
  const x = (ix + 0.1 + 0.8 * hash(ix + 11, iy + 3)) * CS, y = (iy + 0.1 + 0.8 * hash(ix + 5, iy + 17)) * CS;
  const r = Math.hypot(x, y);
  if (r < 8) return null;
  for (let k = 1; k <= RING_N; k++) if (Math.abs(r - (START_R + RING_W * k)) < 3.2) return null;   // halka sınırı boş kalır
  const pk = hash(ix + 29, iy + 31), h2 = hash(ix + 2, iy + 9), outer = r > OUTER_R + 2;
  let spr;
  if (outer) spr = pk < 0.7 ? SPR_OUT[(h2 * 3) | 0] : SPR_OUT[3 + ((h2 * 2) | 0)];
  else spr = pk < 0.5 ? SPR_REG[(h2 * 4) | 0] : pk < 0.88 ? SPR_REG[4 + ((h2 * 4) | 0)] : SPR_REG[8 + ((h2 * 2) | 0)];
  const fy = y * Z * TILT;
  return { t: 0, x, y, r, k: fy, spr, fx: Math.round(x * Z - spr.width / 2), fy: Math.round(fy - spr.height + 2) };
}

  for (let ix = -n; ix <= n; ix++) for (let iy = -n; iy <= n; iy++) {

    if (t && t.r > openR + WALL0 && t.r <= openR + WALL_D) wallTrees.push(t);

  wallTrees.sort((a, b) => a.k - b.k);

  F.globalAlpha = 0.85 + 0.1 * Math.sin(s.time * 7); dspr(house.emit, -48, -110); F.globalAlpha = 1;
  F.globalCompositeOperation = 'lighter';
  glowAt(-15, -31, 20, 0.2); glowAt(15, -31, 20, 0.2);
  for (const L of LIGHTS) glowAt(fxp(L.x), fyp(L.y) - 26, 38, 0.2 * L.k);
  F.globalCompositeOperation = 'source-over';
  LIGHTS.forEach((L, i) => drawFlame(Math.round(fxp(L.x)), Math.round(fyp(L.y)) - 23, s.time, i));
  drawSoldierFx();
  if (showRange) drawRange();
  for (const p of s.parts) { F.globalAlpha = Math.min(1, p.life / (p.max * 0.4)); F.fillStyle = p.c; F.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s); }
  F.globalAlpha = 1;
  for (const f of s.floaters) {
    F.globalAlpha = 1 - Math.max(0, (f.t - 0.6) / 0.4);
    pixText(F, '+' + ZB.reward, Math.round(f.x - 12), Math.round(f.y - f.t * 26), '#e0b25a', 2);
  }
  F.globalAlpha = 1;
}

/* ---------- ekrana basma: WebGL ile küre bükmesi + vinyet; yoksa düz kırpma ---------- */
let gl = null, disp = null, ctx2 = null, vig2 = null, glTex = null, glU = {};
function buildVig2() {
  const c = mk(VW, VH), g = c.getContext('2d'), img = g.createImageData(VW, VH), d = img.data;
  for (let y = 0; y < VH; y++) for (let x = 0; x < VW; x++) {
    const rr = Math.hypot((x + 0.5 - VW / 2) / (VW / 2), (y + 0.5 - VH / 2) / (VH / 2));
    if (clamp((rr - 0.62) / 0.8, 0, 1) * 0.9 > bay(x, y) * 0.9) { const i = (y * VW + x) * 4; d[i] = 13; d[i + 1] = 10; d[i + 2] = 20; d[i + 3] = 150; }
  }
  g.putImageData(img, 0, 0); return c;
}
(function initDisplay() {
  try {
    const glc = mk(VW, VH), ctx = glc.getContext('webgl', { antialias: false, alpha: false });
    const setup = () => {
      const sh = (type, src) => { const s = ctx.createShader(type); ctx.shaderSource(s, src); ctx.compileShader(s); if (!ctx.getShaderParameter(s, ctx.COMPILE_STATUS)) throw new Error(ctx.getShaderInfoLog(s)); return s; };
      const vs = sh(ctx.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}');
      const fs = sh(ctx.FRAGMENT_SHADER, [
        '#ifdef GL_FRAGMENT_PRECISION_HIGH', 'precision highp float;', '#else', 'precision mediump float;', '#endif',
        'uniform sampler2D t;uniform vec2 view;uniform vec2 sz;uniform float K;',
        'void main(){',
        ' vec2 fc=gl_FragCoord.xy;vec2 o=fc-view*0.5;vec2 nn=o/(view*0.5);float rr2=dot(nn,nn);',
        ' vec2 s=(o*(1.0+K*rr2)+sz*0.5)/sz;vec3 c=texture2D(t,s).rgb;',
        ' float a=clamp((sqrt(rr2)-0.62)/0.8,0.0,1.0)*0.9;',
        ' vec2 q=mod(floor(fc),4.0);float x0=mod(q.x,2.0),x1=floor(q.x/2.0),y0=mod(q.y,2.0),y1=floor(q.y/2.0);',
        ' float b=(8.0*abs(x0-y0)+4.0*y0+2.0*abs(x1-y1)+y1+0.5)/16.0;',
        ' if(a>b*0.9)c=mix(c,vec3(0.05,0.04,0.08),0.59);',
        ' gl_FragColor=vec4(c,1.0);}'
      ].join('\n'));
      const pr = ctx.createProgram(); ctx.attachShader(pr, vs); ctx.attachShader(pr, fs); ctx.linkProgram(pr);
      if (!ctx.getProgramParameter(pr, ctx.LINK_STATUS)) throw new Error('link');
      ctx.useProgram(pr);
      const buf = ctx.createBuffer(); ctx.bindBuffer(ctx.ARRAY_BUFFER, buf);
      ctx.bufferData(ctx.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), ctx.STATIC_DRAW);
      const loc = ctx.getAttribLocation(pr, 'p'); ctx.enableVertexAttribArray(loc); ctx.vertexAttribPointer(loc, 2, ctx.FLOAT, false, 0, 0);
      glTex = ctx.createTexture(); ctx.bindTexture(ctx.TEXTURE_2D, glTex);
      ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MIN_FILTER, ctx.NEAREST); ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_MAG_FILTER, ctx.NEAREST);
      ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_S, ctx.CLAMP_TO_EDGE); ctx.texParameteri(ctx.TEXTURE_2D, ctx.TEXTURE_WRAP_T, ctx.CLAMP_TO_EDGE);
      ctx.pixelStorei(ctx.UNPACK_FLIP_Y_WEBGL, true);
      ctx.uniform2f(ctx.getUniformLocation(pr, 'view'), VW, VH); ctx.uniform2f(ctx.getUniformLocation(pr, 'sz'), FW, FH);
      glU.K = ctx.getUniformLocation(pr, 'K');
      gl = ctx; disp = glc;
    };
    if (ctx) { setup(); glc.addEventListener('webglcontextlost', e => { e.preventDefault(); }); glc.addEventListener('webglcontextrestored', () => { try { setup(); } catch (e) { /* bir sonraki karede tekrar denenir */ } }); }
  } catch (e) { gl = null; disp = null; }
  if (!disp) { disp = mk(VW, VH); ctx2 = disp.getContext('2d'); ctx2.imageSmoothingEnabled = false; vig2 = buildVig2(); }
  disp.id = 'game'; disp.setAttribute('role', 'img');
  disp.setAttribute('aria-label', 'Kule savunma oyunu: ormanla çevrili otlağın ortasında köylü evi, çatısındaki okçu ağaçların arasından gelen zombilere ok atıyor');
  document.getElementById('holder').appendChild(disp);
})();
function present() {
  if (gl && gl.isContextLost()) return;
  if (gl) {
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, flat);
    gl.uniform1f(glU.K, warpOn ? WARP_K : 0);
    gl.viewport(0, 0, VW, VH);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    ctx2.drawImage(flat, (FW - VW) / 2, (FH - VH) / 2, VW, VH, 0, 0, VW, VH);
    ctx2.drawImage(vig2, 0, 0);
  }
}

const $ = id => document.getElementById(id);
pixIcon($('icoCoin'), ['..oooo..', '.oYYyyo.', 'oYyyyydo', 'oYyddydo', 'oYyddydo', 'oyyyyydo', '.oyyddo.', '..oooo..'], { o: '#0c0910', Y: '#f0d080', y: '#d9a94a', d: '#a8742c' });
pixIcon($('icoHeart'), ['..oo.oo..', '.oRRoRRo.', 'oRRrrrrro', 'oRrrrrrro', 'oRrrrrrro', '.orrrrro.', '..orrro..', '...ooo...'], { o: '#0c0910', R: '#d0646b', r: '#a24f55' });

const coinsEl = $('coins'), hpFill = $('hpfill'), hpText = $('hptext'), killsEl = $('kills');
const pauseBtn = $('pauseBtn'), speedBtn = $('speedBtn'), rangeBtn = $('rangeBtn'), warpBtn = $('warpBtn'), restartBtn = $('restartBtn');
const pauseOv = $('pauseOv'), overOv = $('overOv'), overText = $('overText'), hintEl = $('hint');
const hud = { coins: -1, hp: -1, kills: -1 };
const fmt = n => n.toLocaleString('tr-TR');

function refreshChips() {
  $('rules').innerHTML = [
    'Açık alan ' + (openR * 2) + ' m çap', 'Açılan halka ' + state.openRings + '/' + RING_N + ' (50 m)', 'Menzil ' + CF.range + ' m', 'Zombi hızı ' + fmt(ZB.speed) + ' m/sn',
    'Ok ' + fmt(CF.interval) + ' sn', 'Zombi ' + ZB.hp + ' can', 'Ödül ' + ZB.reward + ' para'
  ].map(t => '<span class="chip">' + t + '</span>').join('');
}
function updateHud() {
  const s = state, hp = Math.ceil(s.hp);
  if (hud.coins !== s.coins) { coinsEl.textContent = s.coins; hud.coins = s.coins; }
  if (hud.kills !== s.kills) { killsEl.textContent = s.kills; hud.kills = s.kills; }
  if (hud.hp !== hp) { hpText.textContent = hp; hpFill.style.width = (100 * s.hp / TW.hp) + '%'; hud.hp = hp; }
}
function showOver() {
  const s = state;
  overText.textContent = s.kills + ' zombi öldürdün, ' + s.coins + ' para topladın, ' + Math.round(s.time) + ' sn dayandın.';
  overOv.hidden = false; pauseOv.hidden = true;
}
function setPaused(v) { if (state.over) return; state.paused = v; pauseBtn.textContent = v ? 'Devam' : 'Duraklat'; pauseOv.hidden = !v; }
function restart() {
  state = newState(); state.speed = SPEEDS[speedIdx];
  cam.x = 0; cam.y = 0; cam.zoom = 3;
  setRings(0);
  hud.coins = hud.hp = hud.kills = -1; overOv.hidden = true; pauseOv.hidden = true; pauseBtn.textContent = 'Duraklat';
}
pauseBtn.addEventListener('click', () => setPaused(!state.paused));
restartBtn.addEventListener('click', restart);
speedBtn.addEventListener('click', () => { speedIdx = (speedIdx + 1) % SPEEDS.length; state.speed = SPEEDS[speedIdx]; speedBtn.textContent = 'Hız ' + state.speed + '×'; });
rangeBtn.addEventListener('click', () => { showRange = !showRange; rangeBtn.setAttribute('aria-pressed', String(showRange)); });
warpBtn.addEventListener('click', () => { warpOn = !warpOn; warpBtn.setAttribute('aria-pressed', String(warpOn)); });
$('zoomIn').addEventListener('click', () => zoomAt(null, null, 1.25));
$('zoomOut').addEventListener('click', () => zoomAt(null, null, 1 / 1.25));
$('homeBtn').addEventListener('click', () => { cam.x = 0; cam.y = 0; cam.zoom = 3; });

/* sürükle: kaydır · tekerlek / sıkıştır: yakınlaştır · ok tuşları, WASD, + − */
const pts = new Map();
let pinchD = 0;
function hideHint() { hintEl.hidden = true; }
disp.addEventListener('pointerdown', e => { disp.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); } });
disp.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const rc = disp.getBoundingClientRect(), k = VW / rc.width, dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size === 1) {
    const f = warpFactor((e.clientX - rc.left) * k - VW / 2, (e.clientY - rc.top) * k - VH / 2);
    cam.x -= dx * k * f / (cam.zoom * Z); cam.y -= dy * k * f / (cam.zoom * Z * TILT); clampCam(); hideHint();
  } else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD > 0) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / pinchD);
    pinchD = d; hideHint();
  }
});
const endPtr = e => { pts.delete(e.pointerId); pinchD = 0; };
disp.addEventListener('pointerup', endPtr); disp.addEventListener('pointercancel', endPtr);
disp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0015)); hideHint(); }, { passive: false });
document.addEventListener('keydown', e => {
  if (e.target !== document.body) return;
  const step = 14 / cam.zoom;
  if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space'].includes(e.code)) { e.preventDefault(); keys.add(e.code); if (e.code === 'Space') state.sol.jumpReq = true; hideHint(); return; }
  if ((e.code === 'Enter' || e.code === 'NumpadEnter')) { e.preventDefault(); if (!e.repeat) soldierAttack(); hideHint(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { e.preventDefault(); setPaused(!state.paused); return; }
  if (e.code === 'ArrowLeft') cam.x -= step;
  else if (e.code === 'ArrowRight') cam.x += step;
  else if (e.code === 'ArrowUp') cam.y -= step;
  else if (e.code === 'ArrowDown') cam.y += step;
  else if (e.key === '+' || e.key === '=') zoomAt(null, null, 1.15);
  else if (e.key === '-') zoomAt(null, null, 1 / 1.15);
  else return;
  e.preventDefault(); clampCam(); hideHint();
});
document.addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'Enter' || e.code === 'NumpadEnter') state.sol.holding = false; });
window.addEventListener('blur', () => keys.clear());

/* sahneyi pencere genişliğine sığdır; mümkünse tam sayı katında (keskin pikseller) */
function fit() {
  const ww = document.querySelector('.wrap').clientWidth; if (!ww) return;          // panel henüz yerleşmediyse bekle
  const avail = Math.max(280, ww - 8);
  let sc = avail / VW;
  if (sc >= 2) sc = Math.floor(sc);
  disp.style.width = Math.round(VW * sc) + 'px';
  disp.style.height = Math.round(VH * sc) + 'px';
  disp.style.imageRendering = sc >= 1 ? 'pixelated' : 'auto';
}
if (window.ResizeObserver) new ResizeObserver(fit).observe(document.querySelector('.wrap')); else window.addEventListener('resize', fit);
fit();
window.addEventListener('resize', fit); window.addEventListener('load', fit); document.addEventListener('visibilitychange', fit);
let fitN = 0; const fitT = setInterval(() => { fit(); if (++fitN > 16) clearInterval(fitT); }, 250);   // yan pencere açılırken boyut değişebilir
try { window.focus(); } catch (e) { /* yoksay */ }
document.addEventListener('pointerdown', () => { try { window.focus(); } catch (e) { /* yoksay */ } });
document.addEventListener('click', e => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });   // Boşluk tuşu düğmeleri tetiklemesin

setRings(0);
let last = null;
function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (!state.paused) {
    if (state.over) updateEffects(dt);
    else { const total = dt * state.speed, n = Math.max(1, Math.ceil(total / (1 / 60))); for (let i = 0; i < n && !state.over; i++) update(total / n); }
  }
  drawWorld(); present(); updateHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
